name: Biblioteca CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test
        working-directory: backend
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --watchAll=false --passWithNoTests
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  deploy:
    name: Aceitação local em containers (sem AWS)
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Aguardar API
        run: |
          for tentativa in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/autores; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: bash scripts/aceitacao.sh
      - name: Verificar frontend e proxy
        run: |
          curl -fsS http://localhost:3000/ | grep 'Biblioteca Web'
          curl -fsS http://localhost:3000/api/autores
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
